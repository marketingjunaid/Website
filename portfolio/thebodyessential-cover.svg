<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="tbe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#141210"/>
      <stop offset="55%"  stop-color="#1d1913"/>
      <stop offset="100%" stop-color="#100e0a"/>
    </linearGradient>
    <linearGradient id="tbe-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a97a" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#c9a97a" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#c9a97a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c9a97a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tbe-glow" cx="50%" cy="38%" r="46%">
      <stop offset="0%"   stop-color="#e9c98a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c9a97a" stop-opacity="0"/>
    </radialGradient>
    <filter id="tbe-text-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#c9a97a" flood-opacity="0.45"/>
    </filter>
    <filter id="tbe-icon-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e9c98a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#tbe-bg)"/>
  <ellipse cx="300" cy="130" rx="260" ry="150" fill="url(#tbe-glow)"/>

  <!-- Cosmetic pump bottle + droplet motif -->
  <g transform="translate(300,120)" filter="url(#tbe-icon-glow)">
    <!-- pump bottle -->
    <rect x="-22" y="-6" width="44" height="54" rx="8" fill="#c9a97a" opacity="0.9"/>
    <rect x="-12" y="-22" width="24" height="18" rx="4" fill="#b8915f" opacity="0.95"/>
    <rect x="-4" y="-34" width="8" height="14" rx="2" fill="#b8915f" opacity="0.95"/>
    <rect x="4" y="-30" width="18" height="5" rx="2.5" fill="#e9c98a"/>
    <!-- label line -->
    <rect x="-14" y="8" width="28" height="2" rx="1" fill="#1d1913" opacity="0.5"/>
    <rect x="-14" y="16" width="20" height="2" rx="1" fill="#1d1913" opacity="0.35"/>
    <!-- droplet -->
    <path d="M44,6 C44,6 34,18 34,26 a10 10 0 0 0 20 0 C54,18 44,6 44,6 Z" fill="#e9c98a" opacity="0.85"/>
  </g>

  <!-- Brand name -->
  <text x="300" y="205" font-family="Georgia, 'Times New Roman', serif"
        font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle"
        letter-spacing="2" filter="url(#tbe-text-glow)">THE BODY ESSENTIAL</text>
  <text x="300" y="230" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="400" fill="#c9a97a" text-anchor="middle"
        letter-spacing="4">PAKISTAN'S #1 BEAUTY STORE</text>

  <text x="300" y="252" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" font-weight="400" fill="rgba(255,255,255,0.4)" text-anchor="middle"
        letter-spacing="1" font-style="italic">Skincare · Makeup · Fragrance · Hair Care</text>

  <rect x="120" y="263" width="360" height="1" fill="url(#tbe-shimmer)" opacity="0.5"/>

  <!-- Bottom bar -->
  <rect x="0" y="290" width="600" height="50" fill="rgba(12,9,6,0.95)"/>
  <rect x="0" y="290" width="600" height="1" fill="url(#tbe-shimmer)" opacity="0.5"/>

  <rect x="70" y="305" width="110" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="125" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Shopify Store</text>

  <rect x="190" y="305" width="104" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="242" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">E-commerce</text>

  <rect x="304" y="305" width="94" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="351" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Beauty</text>

  <rect x="408" y="305" width="122" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="469" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Retail Catalog</text>

  <rect x="0" y="0" width="600" height="2" fill="url(#tbe-shimmer)"/>
  <g stroke="#c9a97a" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M 18 18 L 18 36"/><path d="M 18 18 L 36 18"/>
    <path d="M 582 288 L 582 270"/><path d="M 582 288 L 564 288"/>
  </g>
</svg>
