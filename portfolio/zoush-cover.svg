<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="zo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#141210"/>
      <stop offset="55%"  stop-color="#1d1913"/>
      <stop offset="100%" stop-color="#100e0a"/>
    </linearGradient>
    <linearGradient id="zo-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a97a" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#c9a97a" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#c9a97a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c9a97a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="zo-glow" cx="50%" cy="38%" r="46%">
      <stop offset="0%"   stop-color="#e9c98a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c9a97a" stop-opacity="0"/>
    </radialGradient>
    <filter id="zo-text-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#c9a97a" flood-opacity="0.45"/>
    </filter>
    <filter id="zo-icon-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e9c98a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#zo-bg)"/>
  <ellipse cx="300" cy="130" rx="260" ry="150" fill="url(#zo-glow)"/>

  <!-- Lipstick + cream jar motif -->
  <g transform="translate(300,120)" filter="url(#zo-icon-glow)">
    <!-- cream jar -->
    <rect x="-40" y="14" width="40" height="30" rx="6" fill="#c9a97a" opacity="0.9"/>
    <rect x="-42" y="6" width="44" height="10" rx="5" fill="#b8915f" opacity="0.95"/>
    <!-- lipstick -->
    <rect x="14" y="-6" width="16" height="34" rx="3" fill="#c9a97a" opacity="0.9"/>
    <rect x="16" y="-30" width="12" height="26" rx="4" fill="#e9c98a"/>
    <path d="M16,-30 L28,-30 L28,-22 L22,-32 Z" fill="#b8915f"/>
    <!-- sparkle -->
    <g fill="#e9c98a" opacity="0.9">
      <path d="M-8,-24 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 z"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="300" y="205" font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle"
        letter-spacing="6" filter="url(#zo-text-glow)">ZOUSH</text>
  <text x="300" y="228" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="400" fill="#c9a97a" text-anchor="middle"
        letter-spacing="4">BY ZOYA SHOUKAT</text>

  <text x="300" y="250" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" font-weight="400" fill="rgba(255,255,255,0.4)" text-anchor="middle"
        letter-spacing="1" font-style="italic">Skincare · Hybrid Makeup · Lip Care</text>

  <rect x="120" y="262" width="360" height="1" fill="url(#zo-shimmer)" opacity="0.5"/>

  <!-- Bottom bar -->
  <rect x="0" y="290" width="600" height="50" fill="rgba(12,9,6,0.95)"/>
  <rect x="0" y="290" width="600" height="1" fill="url(#zo-shimmer)" opacity="0.5"/>

  <rect x="86" y="305" width="110" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="141" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Shopify Store</text>

  <rect x="206" y="305" width="104" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="258" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">E-commerce</text>

  <rect x="320" y="305" width="94" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="367" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Beauty</text>

  <rect x="424" y="305" width="90" height="22" rx="11" fill="rgba(201,169,122,0.12)" stroke="#c9a97a" stroke-width="0.8" opacity="0.85"/>
  <text x="469" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" fill="#c9a97a" letter-spacing="0.5">Cosmetics</text>

  <rect x="0" y="0" width="600" height="2" fill="url(#zo-shimmer)"/>
  <g stroke="#c9a97a" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M 18 18 L 18 36"/><path d="M 18 18 L 36 18"/>
    <path d="M 582 288 L 582 270"/><path d="M 582 288 L 564 288"/>
  </g>
</svg>
